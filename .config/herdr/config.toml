onboarding = false

[theme]
name = "gruvbox"
auto_switch = false

[ui]
agent_panel_sort = "spaces"
sidebar_width = 32
sidebar_min_width = 0
sidebar_max_width = 36
pane_gaps = false
pane_scrollbars = false

show_agent_labels_on_pane_borders = true
[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "workspace", "tab"],
  ["agent"],
]

[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

[keys]
prefix = "`"

# herdr-floax:keybind
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-floax.toggle"
description = "Toggle floating pane"

[ui.toast]
delivery = "herdr"
