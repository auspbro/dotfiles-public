onboarding = false

[theme]
name = "gruvbox"
auto_switch = false

[ui]
agent_panel_sort = "spaces"
sidebar_width = 32
sidebar_min_width = 0
sidebar_max_width = 36
pane_gaps = false

[keys]
prefix = "`"

# herdr-floax:keybind
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-floax.toggle"
description = "Toggle floating pane"
